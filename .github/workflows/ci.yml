name: CI

# Lints, tests and builds the frontend and runs the backend's tests on every push and pull request,
# so a change that breaks either shows up as a failed check on its commit.

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot, so stop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      # From the repo root, where pytest.ini lives. The integration tests need a running backend, so
      # pytest.ini leaves them out.
      - name: Test
        run: pytest
