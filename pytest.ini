[pytest]
# The backend's modules import each other by bare name (from config import ...), as uvicorn runs them from backend/.
pythonpath = backend
testpaths = backend/tests tests
# The integration tests time a running backend; run them on their own with: pytest -m integration
addopts = -m "not integration"
markers =
    integration: tests that touch external systems such as network or filesystem
    slow: tests that take longer than typical unit tests
